name: Publish NPM Package
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+"
permissions:
  id-token: write
  contents: read
jobs:
  get_semver:
    name: Create semver
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on main for safety
        run: git branch --remote --contains | grep origin/main

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: "5.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7

    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}

  build_and_publish:
    name: Build centeva-angular-mentions
    runs-on: [self-hosted, linux]
    needs:
      - get_semver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Set package version
        run: |
          cd ./projects/angular-mentions
          npm version ${{ needs.get_semver.outputs.semVer }} --git-tag-version=false

      - name: Install dependencies
        run: npm ci

      - name: Build library (production)
        run: npx ng build angular-mentions --configuration production

      - name: Publish
        run: |
          cd ./dist/centeva-angular-mentions
          npm publish --ignore-scripts --access public
